name: Build and Push Docker Image to Amazon ECR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
    AWS_REGION: eu-north-1
    ECR_REPOSITORY: devops-status-api

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Show GitHub context
          run: |
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Ref: $GITHUB_REF"
            echo "Ref name: $GITHUB_REF_NAME"

        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
            role-to-assume: arn:aws:iam::639914974934:role/github-actions-devops-status-api
            aws-region: ${{ env.AWS_REGION }}

        - name: Login to Amazon ECR
          id: login-to-ecr
          uses: aws-actions/amazon-ecr-login@v2

        - name: Build Docker Image
          run: |
            docker build \
              -t ${{ steps.login-to-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
              .

        - name: Push Docker Image to Amazon ECR
          run: |
            docker push \
              ${{ steps.login-to-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

        - name: Setup Terraform
          uses: hashicorp/setup-terraform@v3

        - name: Terraform Init
          working-directory: terraform
          run: terraform init

        - name: Terraform Validate
          working-directory: terraform
          run: terraform validate

        - name: Terraform Plan
          working-directory: terraform
          run: terraform plan -var="image_tag=${{ github.sha }}"

        - name: Terraform Apply
          if: github.event_name == 'workflow_dispatch'
          working-directory: terraform
          run: terraform apply -auto-approve tfplan